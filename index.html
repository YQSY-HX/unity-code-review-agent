<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity C# 代码审查 Agent</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 20px; background: #f9f9f9; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user-msg { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai-msg { background: #e9ecef; color: black; margin-right: auto; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input { padding: 8px; font-size: 14px; }
        #session-input { width: 150px; }
        #message-input { flex: 1; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <h1>Unity C# 代码审查 Agent</h1>
    
    <div id="chat-box"></div>
    
    <div class="input-row">
        <input id="session-input" type="text" placeholder="Session ID" value="test001">
        <input id="message-input" type="text" placeholder="输入代码或问题..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">发送</button>
        <button onclick="loadHistory()">加载历史</button>
        <button onclick="sendStreamMessage()">流式发送</button>
    </div>

    <script>
        const API_BASE = "https://unity-code-review-agent-production.up.railway.app";

        function addMessage(role, text) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "msg " + (role === "user" ? "user-msg" : "ai-msg");
            if (role === "ai") {
                div.innerHTML = marked.parse(text);
            } else {
                div.textContent = text;  // 用户消息保持纯文本，防 XSS
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const sessionId = document.getElementById("session-input").value;
            const message = document.getElementById("message-input").value;
            if (!message) return;

            addMessage("user", message);
            document.getElementById("message-input").value = "";

            try {
                const res = await fetch(`${API_BASE}/agent/memory`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ input: message, session_id: sessionId })
                });
                const data = await res.json();
                if (data.success && data.data) {
                    addMessage("ai", data.data.output);
                } else {
                    addMessage("ai", "错误: " + (data.message || "未知错误"));
                }
            } catch (err) {
                addMessage("ai", "网络错误: " + err.message);
            }
        }

        async function loadHistory() {
            const sessionId = document.getElementById("session-input").value;
            const box = document.getElementById("chat-box");
            box.innerHTML = "";

            try {
                const res = await fetch(`${API_BASE}/agent/memory/history?session_id=${sessionId}`);
                const data = await res.json();
                if (data.success && data.data && data.data.history) {
                    data.data.history.forEach(msg => {
                        const role = msg.type === "HumanMessage" ? "user" : "ai";
                        addMessage(role, msg.content);
                    });
                } else {
                    addMessage("ai", "暂无历史记录");
                }
            } catch (err) {
                addMessage("ai", "网络错误: " + err.message);
            }
        }

        async function sendStreamMessage() {
            const sessionId = document.getElementById("session-input").value;
            const message = document.getElementById("message-input").value;
            if (!message) return;

            addMessage("user", message);
            document.getElementById("message-input").value = "";

            // 创建一条 AI 消息气泡，初始显示占位文字
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "msg ai-msg";
            div.id = "streaming-msg";
            div.textContent = "🤔 思考中...";
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;

            // 用来标记是否已经用真正的文本替换过占位符
            let firstText = true;

            try {
                const res = await fetch(`${API_BASE}/agent/memory/stream`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ input: message, session_id: sessionId })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop() || "";

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const data = JSON.parse(line.slice(6));  // ✅ data 在这里定义

                            if (data.type === "text") {
                                if (firstText) {
                                    div.textContent = data.content;   // 替换占位符
                                    firstText = false;
                                } else {
                                    div.textContent += data.content;
                                }
                            } else if (data.type === "tool_start") {
                                div.textContent += "\n🔧 " + data.content;
                            } else if (data.type === "tool_end") {
                                div.textContent += "\n✅ " + data.content;
                            } else if (data.type === "done") {
                                // 流结束，用 Markdown 渲染最终结果
                                div.innerHTML = marked.parse(data.content);
                            } else if (data.type === "error") {
                                div.textContent = "❌ " + data.content;
                            }
                            box.scrollTop = box.scrollHeight;
                        }
                    }
                }
            } catch (err) {
                div.textContent = "网络错误: " + err.message;
            }
        }
        
    </script>
</body>
</html>
